<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fufu NHI Vault — Non-Human Identity Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grid-veil" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        </svg>

    </div>
    <nav class="nav">
      <a href="#/dashboard" class="nav-link" data-route="dashboard">Dashboard</a>
      <a href="#/audit" class="nav-link" data-route="audit">Audit Log</a>
    </nav>
    <div class="topbar-actions">
      <span class="badge badge-proto">Prototype — simulated backend</span>
      <button type="button" class="btn btn-ghost btn-small" id="resetDemoBtn">Reset Demo Data</button>
    </div>
  </div>
</header>

<main id="app" class="app"></main>

<div id="modalRoot" class="modal-root" aria-live="polite"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="app.js"></script>
